services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: top
      POSTGRES_PASSWORD: top
      POSTGRES_DB: top
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top -d top"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Apply the app's bundled drizzle migrations to the fresh, empty preview DB
  # before the app boots. The image ships drizzle-kit + drizzle/, but the app's
  # `start` is `next start` only, so nothing else creates the schema and
  # DB-backed pages would otherwise 500 with "relation ... does not exist".
  migrate:
    image: ghcr.io/${IMAGE_SLUG:?IMAGE_SLUG must be set}/preview:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://top:top@db:5432/top
    command: ["npx", "drizzle-kit", "migrate"]
    restart: "no"

  app:
    image: ghcr.io/${IMAGE_SLUG:?IMAGE_SLUG must be set}/preview:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://top:top@db:5432/top
    ports:
      - "127.0.0.1:3000:3000"
